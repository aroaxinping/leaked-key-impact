[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canary-token-analytics"
version = "0.1.0"
description = "Threat-intelligence analysis of a deliberately leaked AWS canary token"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "matplotlib",
    "ruff",
]
dashboard = [
    "streamlit",
    "plotly",
    "pycountry",
]
gmail = [
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
]

[tool.setuptools.packages.find]
where = ["src"]
