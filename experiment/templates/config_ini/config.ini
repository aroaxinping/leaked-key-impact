[general]
environment = production
batch_size = 5000
timezone = Europe/Madrid

[aws]
region = eu-west-1
landing_bucket = retail-landing-zone-prod
landing_prefix = incoming/orders/
aws_access_key_id = __CANARY_ACCESS_KEY_ID__
aws_secret_access_key = __CANARY_SECRET_ACCESS_KEY__

[warehouse]
host = warehouse.internal
port = 5432
dbname = analytics
user = etl_loader
sslmode = require

[transform]
drop_test_orders = true
default_currency = EUR
